[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-grid-modeling"
version = "0.1.0"
description = "National gridded climate modelling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
climate-grid-modeling = "climate_grid.cli:main"

[tool.setuptools]
packages = ["climate_grid"]
